<div id="elec-calc" style="max-width:520px;margin:0 auto;font-family:'Malgun Gothic',sans-serif;">
  <div style="background:#eef4fc;border:1px solid #cfe0f5;border-radius:10px;padding:14px 18px;margin-bottom:16px;font-size:13px;line-height:1.7;color:#1c3d5a;">
    <b>2026년 한전 주택용(저압) 요율 기준 계산기입니다.</b><br>
    기후환경요금·연료비조정요금은 분기마다 바뀌어 반영하지 못했습니다. 실제 청구서와 몇천원 정도 차이날 수 있습니다.
  </div>

  <label style="display:block;font-weight:700;margin-bottom:6px;">사용 시기</label>
  <select id="ec-season" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:14px;font-size:14px;">
    <option value="normal">일반 계절 (1~6월, 9~12월)</option>
    <option value="summer">하절기 (7~8월, 구간 완화)</option>
  </select>

  <label style="display:block;font-weight:700;margin-bottom:6px;">이번 달 사용량 (kWh)</label>
  <input id="ec-kwh" type="number" placeholder="예: 350" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:14px;font-size:14px;box-sizing:border-box;">

  <label style="display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:13px;color:#555;">
    <input id="ec-tv" type="checkbox"> TV 수신료 포함 (월 2,500원, 한전 통합징수 대상인 경우)
  </label>

  <button id="ec-btn" style="width:100%;padding:12px;background:#2a78d6;color:#fff;border:none;border-radius:6px;font-size:15px;font-weight:700;cursor:pointer;">계산하기</button>

  <div id="ec-result" style="margin-top:20px;display:none;">
    <table style="width:100%;border-collapse:collapse;font-size:13.5px;">
      <tr><td style="padding:8px 0;border-bottom:1px solid #eee;">기본요금</td><td style="padding:8px 0;border-bottom:1px solid #eee;text-align:right;" id="ec-base"></td></tr>
      <tr><td style="padding:8px 0;border-bottom:1px solid #eee;">전력량요금</td><td style="padding:8px 0;border-bottom:1px solid #eee;text-align:right;" id="ec-energy"></td></tr>
      <tr><td style="padding:8px 0;border-bottom:1px solid #eee;">부가가치세(10%)+전력기금(3.7%)</td><td style="padding:8px 0;border-bottom:1px solid #eee;text-align:right;" id="ec-tax"></td></tr>
      <tr id="ec-tv-row" style="display:none;"><td style="padding:8px 0;border-bottom:1px solid #eee;">TV 수신료</td><td style="padding:8px 0;border-bottom:1px solid #eee;text-align:right;">2,500원</td></tr>
      <tr><td style="padding:12px 0 0;font-weight:800;font-size:16px;">예상 청구액</td><td style="padding:12px 0 0;font-weight:800;font-size:16px;text-align:right;color:#2a78d6;" id="ec-total"></td></tr>
    </table>
  </div>
</div>

<script>
(function() {
  const won = n => Math.round(n).toLocaleString('ko-KR') + '원';

  document.getElementById('ec-btn').addEventListener('click', function() {
    const kwh = parseFloat(document.getElementById('ec-kwh').value);
    if (!kwh || kwh <= 0) { alert('사용량을 입력해주세요.'); return; }
    const season = document.getElementById('ec-season').value;
    const includeTv = document.getElementById('ec-tv').checked;

    // 2026 기준: 일반계절 0-200/200-400/400+, 하절기 0-300/300-450/450+
    // 단가(원/kWh)는 두 시기 동일 적용 (하절기 전용 단가는 공개자료 미확인이라 보수적으로 동일 단가 사용)
    const tiers = season === 'summer'
      ? [{limit: 300, rate: 120}, {limit: 450, rate: 214}, {limit: Infinity, rate: 307}]
      : [{limit: 200, rate: 120}, {limit: 400, rate: 214}, {limit: Infinity, rate: 307}];

    let remaining = kwh;
    let prevLimit = 0;
    let energyCost = 0;
    tiers.forEach(t => {
      const bandUsage = Math.max(0, Math.min(remaining, t.limit - prevLimit));
      energyCost += bandUsage * t.rate;
      remaining -= bandUsage;
      prevLimit = t.limit;
    });

    const baseLimit = season === 'summer' ? [300, 450] : [200, 400];
    let base;
    if (kwh <= baseLimit[0]) base = 910;
    else if (kwh <= baseLimit[1]) base = 1600;
    else base = 7300;

    const subtotal = base + energyCost;
    const tax = subtotal * 0.137;
    const tv = includeTv ? 2500 : 0;
    const total = subtotal + tax + tv;

    document.getElementById('ec-base').textContent = won(base);
    document.getElementById('ec-energy').textContent = won(energyCost);
    document.getElementById('ec-tax').textContent = won(tax);
    document.getElementById('ec-tv-row').style.display = includeTv ? '' : 'none';
    document.getElementById('ec-total').textContent = won(total);
    document.getElementById('ec-result').style.display = 'block';
  });
})();
</script>
